<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match</title>
<style>
:root{--bg:#EEF3F1;--surface:#FBFDFC;--ink:#1B2A41;--line:#B4C4BF;--blue:#1F4FD8;--red:#C42B2B;--hl:#F4D35E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#15242A;--ink:#E6EEEA;--line:#2D434B;--blue:#8DAEFF;--red:#FF7B72;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,sans-serif}
main{width:min(92vw,400px);text-align:center}
h1{font-size:30px;margin:0 0 4px}
p{margin:6px 0}
button{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:8px 16px;cursor:pointer}
button:hover{background:var(--hl);color:#1B2A41}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
</style>
<style>
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.card{aspect-ratio:1;font-size:clamp(28px,10vw,44px);padding:0;background:var(--ink);color:var(--bg)}
.card.up{background:var(--surface);color:var(--ink)}
.card.done{background:var(--hl);color:#1B2A41;border-color:var(--line)}
.card:disabled{cursor:default}
</style></head>
<body><main>
<h1>Memory Match</h1>
<p>Flip two cards. Match all 8 pairs.</p>
<p id="s" role="status">Moves: 0</p>
<div class="grid" id="g"></div>
<div class="row"><button id="again">New game</button></div>
</main>
<script>
// Memory Match: 8 emoji, each twice, shuffled. 'open' holds the cards flipped this turn.
const EMOJI = ['🐱','🐶','🦊','🐼','🐸','🦁','🐙','🦋'];
const grid = document.getElementById('g'), status = document.getElementById('s');
let deck, open, locked, moves, found;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; } // Fisher-Yates
function newGame() {
  deck = shuffle([...EMOJI, ...EMOJI]); open = []; locked = false; moves = found = 0; status.textContent = 'Moves: 0';
  grid.innerHTML = '';
  deck.forEach((e, i) => {
    const c = document.createElement('button'); c.className = 'card'; c.textContent = '?';
    c.setAttribute('aria-label', 'Card ' + (i + 1) + ', face down'); c.onclick = () => flip(i, c); grid.appendChild(c);
  });
}
function flip(i, c) {
  if (locked || open.includes(i) || c.classList.contains('done')) return;
  c.classList.add('up'); c.textContent = deck[i]; c.setAttribute('aria-label', 'Card ' + (i + 1) + ', ' + deck[i]);
  open.push(i);
  if (open.length < 2) return;
  moves++; const [a, b] = open, A = grid.children[a], B = grid.children[b];
  if (deck[a] === deck[b]) { // match: keep both face up
    [A, B].forEach(x => { x.classList.add('done'); x.disabled = true; }); open = []; found++;
    status.textContent = found === 8 ? 'You won in ' + moves + ' moves!' : 'Moves: ' + moves;
  } else { // no match: flip them back after a short pause
    locked = true; status.textContent = 'Moves: ' + moves;
    setTimeout(() => {
      [[A, a], [B, b]].forEach(([x, k]) => { x.classList.remove('up'); x.textContent = '?'; x.setAttribute('aria-label', 'Card ' + (k + 1) + ', face down'); });
      open = []; locked = false;
    }, 800);
  }
}
document.getElementById('again').onclick = newGame;
newGame();
</script></body></html>
